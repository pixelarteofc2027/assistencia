spring:
  application:
    name: techflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techflow}
    username: ${DB_USERNAME:techflow}
    password: ${DB_PASSWORD:change-me-local-only}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
